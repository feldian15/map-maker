[project]
name = "map-maker"
version = "0.1.0"
description = "CLI route geometry generator for shaped walking and running loops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "osmnx>=1.9",
]

[project.scripts]
routegen = "routegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routegen"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
